ne">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br><span class="line">72</span><br></pre></td><td class="code"><pre><span class="line"><span class="punctuation">&#123;</span></span><br><span class="line">  <span class="attr">&quot;private&quot;</span><span class="punctuation">:</span> <span class="literal"><span class="keyword">true</span></span><span class="punctuation">,</span> <span class="comment">// npm will refuse to publish it</span></span><br><span class="line">  <span class="attr">&quot;version&quot;</span><span class="punctuation">:</span> <span class="string">&quot;3.4.30&quot;</span><span class="punctuation">,</span> <span class="comment">// https://semver.org/lang/zh-CN/ 语义化版本</span></span><br><span class="line">  <span class="attr">&quot;packageManager&quot;</span><span class="punctuation">:</span> <span class="string">&quot;pnpm@9.4.0&quot;</span><span class="punctuation">,</span> <span class="comment">// 实验属性，当包被使用时推荐使用的包管理工具，被Node.js中的Corepack使用。</span></span><br><span class="line">  <span class="attr">&quot;type&quot;</span><span class="punctuation">:</span> <span class="string">&quot;module&quot;</span><span class="punctuation">,</span> <span class="comment">// type字段用于定义package.json文件和该文件所在目录根目录中 .js文件和无扩展名文件的模块化处理规范，默认值为&#x27;commonjs&#x27;。值为module则采用ESModule规范</span></span><br><span class="line">  <span class="attr">&quot;scripts&quot;</span><span class="punctuation">:</span> <span class="punctuation">&#123;</span></span><br><span class="line">    <span class="attr">&quot;dev&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/dev.js&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;build&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/build.js&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;build-dts&quot;</span><span class="punctuation">:</span> <span class="string">&quot;tsc -p tsconfig.build-browser.json &amp;&amp; tsc -p tsconfig.build-node.json &amp;&amp; rollup -c rollup.dts.config.js&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;clean&quot;</span><span class="punctuation">:</span> <span class="string">&quot;rimraf packages/*/dist temp .eslintcache&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;size&quot;</span><span class="punctuation">:</span> <span class="string">&quot;run-s \&quot;size-*\&quot; &amp;&amp; tsx scripts/usage-size.ts&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;size-global&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/build.js vue runtime-dom -f global -p --size&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;size-esm-runtime&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/build.js vue -f esm-bundler-runtime&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;size-esm&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/build.js runtime-dom runtime-core reactivity shared -f esm-bundler&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;check&quot;</span><span class="punctuation">:</span> <span class="string">&quot;tsc --incremental --noEmit&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;lint&quot;</span><span class="punctuation">:</span> <span class="string">&quot;eslint --cache .&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;format&quot;</span><span class="punctuation">:</span> <span class="string">&quot;prettier --write --cache .&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;format-check&quot;</span><span class="punctuation">:</span> <span class="string">&quot;prettier --check --cache .&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;test&quot;</span><span class="punctuation">:</span> <span class="string">&quot;vitest&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;test-unit&quot;</span><span class="punctuation">:</span> <span class="string">&quot;vitest -c vitest.unit.config.ts&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;test-e2e&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/build.js vue -f global -d &amp;&amp; vitest -c vitest.e2e.config.ts&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;test-dts&quot;</span><span class="punctuation">:</span> <span class="string">&quot;run-s build-dts test-dts-only&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;test-dts-only&quot;</span><span class="punctuation">:</span> <span class="string">&quot;tsc -p packages/dts-built-test/tsconfig.json &amp;&amp; tsc -p ./packages/dts-test/tsconfig.test.json&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;test-coverage&quot;</span><span class="punctuation">:</span> <span class="string">&quot;vitest -c vitest.unit.config.ts --coverage&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;test-bench&quot;</span><span class="punctuation">:</span> <span class="string">&quot;vitest bench&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;release&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/release.js&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;changelog&quot;</span><span class="punctuation">:</span> <span class="string">&quot;conventional-changelog -p angular -i CHANGELOG.md -s&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;dev-esm&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/dev.js -if esm-bundler-runtime&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;dev-compiler&quot;</span><span class="punctuation">:</span> <span class="string">&quot;run-p \&quot;dev template-explorer\&quot; serve&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;dev-sfc&quot;</span><span class="punctuation">:</span> <span class="string">&quot;run-s dev-sfc-prepare dev-sfc-run&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;dev-sfc-prepare&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/pre-dev-sfc.js || npm run build-all-cjs&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;dev-sfc-serve&quot;</span><span class="punctuation">:</span> <span class="string">&quot;vite packages/sfc-playground --host&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;dev-sfc-run&quot;</span><span class="punctuation">:</span> <span class="string">&quot;run-p \&quot;dev compiler-sfc -f esm-browser\&quot; \&quot;dev vue -if esm-bundler-runtime\&quot; \&quot;dev vue -ipf esm-browser-runtime\&quot; \&quot;dev server-renderer -if esm-bundler\&quot; dev-sfc-serve&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;serve&quot;</span><span class="punctuation">:</span> <span class="string">&quot;serve&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;open&quot;</span><span class="punctuation">:</span> <span class="string">&quot;open http://localhost:3000/packages/template-explorer/local.html&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;build-sfc-playground&quot;</span><span class="punctuation">:</span> <span class="string">&quot;run-s build-all-cjs build-runtime-esm build-browser-esm build-ssr-esm build-sfc-playground-self&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;build-all-cjs&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/build.js vue runtime compiler reactivity shared -af cjs&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;build-runtime-esm&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/build.js runtime reactivity shared -af esm-bundler &amp;&amp; node scripts/build.js vue -f esm-bundler-runtime &amp;&amp; node scripts/build.js vue -f esm-browser-runtime&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;build-browser-esm&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/build.js runtime reactivity shared -af esm-bundler &amp;&amp; node scripts/build.js vue -f esm-bundler &amp;&amp; node scripts/build.js vue -f esm-browser&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;build-ssr-esm&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/build.js compiler-sfc server-renderer -f esm-browser&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;build-sfc-playground-self&quot;</span><span class="punctuation">:</span> <span class="string">&quot;cd packages/sfc-playground &amp;&amp; npm run build&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;preinstall&quot;</span><span class="punctuation">:</span> <span class="string">&quot;npx only-allow pnpm&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;postinstall&quot;</span><span class="punctuation">:</span> <span class="string">&quot;simple-git-hooks&quot;</span></span><br><span class="line">  <span class="punctuation">&#125;</span><span class="punctuation">,</span></span><br><span class="line">  <span class="attr">&quot;simple-git-hooks&quot;</span><span class="punctuation">:</span> <span class="punctuation">&#123;</span></span><br><span class="line">    <span class="attr">&quot;pre-commit&quot;</span><span class="punctuation">:</span> <span class="string">&quot;pnpm lint-staged &amp;&amp; pnpm check&quot;</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;commit-msg&quot;</span><span class="punctuation">:</span> <span class="string">&quot;node scripts/verify-commit.js&quot;</span></span><br><span class="line">  <span class="punctuation">&#125;</span><span class="punctuation">,</span></span><br><span class="line">  <span class="attr">&quot;lint-staged&quot;</span><span class="punctuation">:</span> <span class="punctuation">&#123;</span></span><br><span class="line">    <span class="attr">&quot;*.&#123;js,json&#125;&quot;</span><span class="punctuation">:</span> <span class="punctuation">[</span></span><br><span class="line">      <span class="string">&quot;prettier --write&quot;</span></span><br><span class="line">    <span class="punctuation">]</span><span class="punctuation">,</span></span><br><span class="line">    <span class="attr">&quot;*.ts?(x)&quot;</span><span class="punctuation">:</span> <span class="punctuation">[</span></span><br><span class="line">      <span class="string">&quot;eslint --fix&quot;</span><span class="punctuation">,</span></span><br><span class="line">      <span class="string">&quot;prettier --parser=typescript --write&quot;</span></span><br><span class="line">    <span class="punctuation">]</span></span><br><span class="line">  <span class="punctuation">&#125;</span><span class="punctuation">,</span></span><br><span class="line">  <span class="attr">&quot;engines&quot;</span><span class="punctuation">:</span> <span class="punctuation">&#123;</span></span><br><span class="line">    <span class="attr">&quot;node&quot;</span><span class="punctuation">:</span> <span class="string">&quot;&gt;=18.12.0&quot;</span></span><br><span class="line">  <span class="punctuation">&#125;</span></span><br><span class="line">  <span class="attr">&quot;pnpm&quot;</span><span class="punctuation">:</span> <span class="punctuation">&#123;</span></span><br><span class="line">    <span class="attr">&quot;peerDependencyRules&quot;</span><span class="punctuation">:</span> <span class="punctuation">&#123;</span></span><br><span class="line">      <span class="attr">&quot;allowedVersions&quot;</span><span class="punctuation">:</span> <span class="punctuation">&#123;</span></span><br><span class="line">        <span class="attr">&quot;typescript-eslint&gt;eslint&quot;</span><span class="punctuation">:</span> <span class="string">&quot;^9.0.0&quot;</span><span class="punctuation">,</span></span><br><span class="line">        <span class="attr">&quot;@typescript-eslint/eslint-plugin&gt;eslint&quot;</span><span class="punctuation">:</span> <span class="string">&quot;^9.0.0&quot;</span><span class="punctuation
